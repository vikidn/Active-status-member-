<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Status Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3); text-align: center; }
        .header { margin-bottom: 2rem; }
        .avatar { width: 70px; height: 70px; background: #eab308; color: #0f172a; font-weight: bold; font-size: 1.8rem; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 0 15px rgba(234, 179, 8, 0.4); }
        h1 { font-size: 1.5rem; letter-spacing: 0.5px; }
        .badge { display: inline-block; background-color: #22c55e; color: #ffffff; padding: 0.35rem 1rem; border-radius: 50px; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 0.5rem; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
        .info-group { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #334155; font-size: 0.95rem; }
        .info-group:last-of-type { border-bottom: none; }
        .label { color: #94a3b8; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; text-align: left; }
        .value { font-weight: 600; text-align: right; color: #f1f5f9; }
        .code-val { font-family: 'Courier New', Courier, monospace; color: #38bdf8; background: #0f172a; padding: 0.2rem 0.5rem; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="avatar">VIP</div>
            <h1>Account Status</h1>
            <span class="badge">Active</span>
        </div>
        
        <div class="info-group">
            <span class="label">Name</span>
            <span class="value">PATRYK MATEUSZ RUSINIAK</span>
        </div>
        
        <div class="info-group">
            <span class="label">Duration</span>
            <span class="value">31 Days</span>
        </div>
        
        <div class="info-group">
            <span class="label">Code</span>
            <span class="value code-val">HTC4455</span>
        </div>
    </div>

</body>
</html>
